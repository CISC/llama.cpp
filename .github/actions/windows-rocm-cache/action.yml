name: "Create ROCm cache"
description: "Cache ROCm Installation"
inputs:
  version:
    description: "ROCm version (change the default, do not pass input)"
    required: false
    default: "25.Q3"
outputs:
  cache-hit:
    description: "actions/cache output"
    value: ${{ steps.cache-rocm.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    - name: Cache ROCm Installation
      uses: ./.github/actions/cache-from-exe
      with:
        url: https://download.amd.com/developer/eula/rocm-hub/AMD-Software-PRO-Edition-${{ inputs.version }}-WinSvr2022-For-HIP.exe
        path: C:\Program Files\AMD\ROCm
        args: -install
        key: rocm-${{ inputs.version }}-${{ runner.os }}
